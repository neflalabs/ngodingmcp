name: CI

# Pushes to main are checked by release.yml, which calls this workflow
# (workflow_call) before it tags and builds, so the checks live in one place
# and do not run twice per push.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # Pinned here and in the Makefile (STATICCHECK_VERSION); keep both in
      # step. `go run pkg@version` leaves go.mod untouched.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 -race ./...
